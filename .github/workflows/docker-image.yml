name: CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build com Maven
        run: mvn -B package --file pom.xml

      - name: Login no DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build da imagem
        run: docker build -t robelio/java-sample-app:${{ github.sha }} .

      - name: Push da imagem
        run: docker push robelio/java-sample-app:${{ github.sha }}

      - name: Update k8s Manifest
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Atualiza a imagem no deployment.yaml
          sed -i "s|robelio/java-sample-app:[^[:space:]\"]*|robelio/java-sample-app:${IMAGE_TAG}|g" deploy/deployment.yaml

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add deploy/deployment.yaml
          git commit -m "Update deployment to SHA ${IMAGE_TAG}" || echo "Sem mudanças para commit"
          git push
